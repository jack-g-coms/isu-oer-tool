services:
  db:
    image: ankane/pgvector:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oer_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  workers:
    build: .
    container_name: workers
    command: ["npm", "run", "workers"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/oer_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_HOST: http://host.docker.internal:11434
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: root
      S3_SECRET_KEY: isu_oer_dev_environment
    depends_on:
      - db
      - redis

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: isu_oer_dev_environment
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
      
volumes:
  pgdata:
  redis-data:
  minio-data:
