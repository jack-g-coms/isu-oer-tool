services:
  db:
    image: ankane/pgvector:latest
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  workers:
    build: .
    container_name: workers
    command: ["npm", "run", "workers"]
    env_file:
      - .env.local
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://postgres:postgres@db:5432/oer_dev
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - db
      - redis

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.local
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
      
volumes:
  pgdata:
  redis-data:
  minio-data:
