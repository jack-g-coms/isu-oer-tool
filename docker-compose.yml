services:
  db:
    image: ankane/pgvector:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oer_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  worker-ingestion:
    build: .
    container_name: worker-ingestion
    command: ["npm", "run", "worker-ingestion"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/oer_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_HOST: http://host.docker.internal:11434
    depends_on:
      - db
      - redis
      
volumes:
  pgdata:
  redis-data:
